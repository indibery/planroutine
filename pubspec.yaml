name: planroutine
description: "공직플랜 — 공직자를 위한 업무 일정 관리 앱"
publish_to: 'none'
version: 1.3.0+52

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 한국어 로컬라이제이션
  flutter_localizations:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^2.6.1

  # 라우팅
  go_router: ^15.1.2

  # 불변 모델
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 로컬 DB
  sqflite: ^2.4.2
  path: ^1.9.1

  # CSV 파싱
  csv: ^6.0.0

  # 파일 피커
  file_picker: ^9.2.1

  # 날짜 포맷
  intl: ^0.20.2
  charset_converter: ^2.3.0

  # 온보딩 힌트 표시 여부 영구 저장
  shared_preferences: ^2.3.3

  # 앱 버전/빌드 번호 조회 (설정 화면 앱 정보 섹션)
  package_info_plus: ^8.1.2

  # CSV 내보내기 공유시트 (파일/이메일/에어드롭)
  share_plus: ^10.1.2
  path_provider: ^2.1.5

  # 구글 계정 로그인 (iOS Info.plist에 GIDClientID + URL scheme 설정 필요)
  google_sign_in: ^6.2.1
  # Calendar API + OAuth2 인증 (google_sign_in과 연동)
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2

  # 시스템 캘린더(iOS EventKit / Android CalendarContract) 통합
  device_calendar: ^4.3.3
  # OS 캘린더 권한 요청 + 거부 시 설정 앱 직접 이동
  permission_handler: ^11.3.1

  # 로컬 알림 (월초/1주 전/1일 전 리마인더)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # 커스텀 폰트 (디자인 시스템 적용용)
  google_fonts: ^6.2.1

  # 인앱 개인정보처리방침 링크를 브라우저로 연다 (Play·App Store 공통 요건)
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5

  # Repository 유닛 테스트용 — in-memory SQLite (FFI)
  sqflite_common_ffi: ^2.3.4+4

  # 앱 아이콘 자동 생성 (assets/icon/app_icon.png → ios/Runner/Assets.xcassets)
  # 실행: `dart run flutter_launcher_icons`
  flutter_launcher_icons: ^0.14.3

# 앱 아이콘 설정 — 원본 이미지는 `flutter test test/tools/gen_app_icon.dart`로
# LogoHybrid(BrandLogo)를 1024×1024 PNG로 렌더한 뒤, `dart run
# flutter_launcher_icons`로 각 iOS/Android 사이즈를 재생성한다.
flutter_launcher_icons:
  ios: true
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true # App Store 업로드 요구 (iOS 아이콘 alpha 금지)
  # 색 hex를 여기 박지 않는다 — `adaptive_icon_background`는 이미지 경로도 받는다.
  # hex로 두면 네이비의 출처가 AppColors와 pubspec 둘이 되고, 팔레트를 손볼 때
  # 아이콘 배경만 옛 색으로 남는다(그 사실은 홈 화면을 눈으로 봐야 드러난다).
  # gen_app_icon.dart가 이미 `Paint()..color = AppColors.navy`로 같은 색을 쓰고 있어
  # 배경 한 장을 더 뽑으면 출처가 코드 하나로 남는다.
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # 도구가 기본으로 전경에 16% inset을 더 넣는다 — gen_app_icon.dart의 markScale이
  # 이미 안전 영역을 겨냥해 줄여 그린 값이라 겹치면 이중으로 줄어든다(실측: 60%로
  # 그려도 최종 로고가 안전 영역의 44%만 채움). markScale이 안전 영역 계산을 전담하므로
  # inset은 0으로 끈다 — 어느 한쪽만 바꾸면 다시 어긋난다.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
